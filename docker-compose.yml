services:
  postgres:
    image: postgres:17-alpine
    container_name: recipe-manager-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=recipe_user
      - POSTGRES_PASSWORD=recipe_password
      - POSTGRES_DB=recipe_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - recipe-manager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_user -d recipe_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  recipe-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-manager-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=recipe_user
      - DB_PASSWORD=recipe_password
      - DB_NAME=recipe_manager
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recipe-manager-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/recipes', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 302 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  recipe-manager-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
