services:
  recipe-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-manager-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=8080
      - SQLITE_STORAGE=/app/data/recipe-manager.sqlite
    volumes:
      # Utiliser un volume nommé pour éviter les problèmes de permissions sur le VPS
      - recipe-data:/app/data
    networks:
      - recipe-manager-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/recipes', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 302 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  recipe-manager-network:
    driver: bridge

volumes:
  recipe-data:
    driver: local

